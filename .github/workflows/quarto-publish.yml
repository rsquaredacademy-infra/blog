# Phase 1: render the Quarto blog and deploy _site to Netlify as a DRAFT.
# Draft deploys get Netlify's automatic X-Robots-Tag: noindex — flip
# production-deploy to true only at DNS cutover (Phase 2+).
# Required repo secrets: NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID.
# Phase 3 setup: R 4.5 + renv restore before render (for refreshed posts;
# legacy bundles stay static). First run populates the renv cache; later runs
# restore from cache.

name: quarto-publish

on:
  push:
    branches: [quarto-migration]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"

      - name: Restore renv packages
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"

      - name: Render site
        run: quarto render

      - name: Deploy to Netlify (draft)
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ./_site
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: ${{ github.event.head_commit.message }}
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
