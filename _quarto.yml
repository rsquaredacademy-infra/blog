project:
  type: website  # NB: standalone `blog` type was removed in Quarto 1.10;
                 # a blog is now a website with a listing page + RSS feed.
  output-dir: _site
  render:
    - "index.qmd"
    - "about.qmd"
    - "posts/**/*.qmd"
    - "r-programming/*.qmd"
    - "data-wrangling/*.qmd"
    - "data-visualization/*.qmd"
    - "r-packages/*.qmd"
  resources:
    - _redirects
    - _headers
    - robots.txt
    - img
    - images
    - rmarkdown-libs

website:
  title: "Rsquared Academy Blog"
  description: "Explore…Discover…Learn"
  site-url: https://blog.rsquaredacademy.com
  search: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
    right:
      - icon: rss
        href: index.xml
  page-footer:
    left: "&copy; 2014–<script>document.write(new Date().getFullYear())</script> <a href=\"https://www.rsquaredacademy.com/\">Rsquared Academy</a>"
    center: "<a href=\"https://www.rsquaredacademy.com/data-science-with-r\">R courses</a>"
    right: "<a href=\"https://www.rsquaredacademy.com/about.html\">About</a> · <a href=\"https://www.rsquaredacademy.com/data-science-corporate-training.html/\">Corporate Training</a> · <a href=\"https://www.rsquaredacademy.com/data-science-university-training.html/\">University Training</a> · <a href=\"https://www.rsquaredacademy.com/terms-and-conditions.html\">Terms</a> · <a href=\"https://www.rsquaredacademy.com/privacy-policy.html\">Privacy</a> · <a href=\"https://www.rsquaredacademy.com/contact.html\">Contact</a>"
  # Analytics (stubbed — fill at launch, Phase 4):
  # google-analytics: "G-XXXXXXXXXX"

execute:
  freeze: true

format:
  html:
    theme: [flatly, darkly]
    toc: true
    toc-depth: 3
    code-copy: true
    code-fold: show
    open-graph:
      site-name: "Rsquared Academy Blog"
      locale: "en_US"
    twitter-card:
      card-style: summary_large_image
      site: "@rsquaredacademy"
      creator: "@rsquaredacademy"
