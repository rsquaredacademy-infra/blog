        text: Home
      - href: https://www.r-bloggers.com/
        text: R Bloggers
      - href: https://rweekly.org/
        text: R Weekly
      - href: about.qmd
        text: About
    right:
      - href: https://rsquared-academy.thinkific.com/
        text: Explore Online Courses
      - icon: rss
        href: index.xml
  page-footer: |
